# Refreshes assets/data/latest-highlight.json with the newest Bagwork video
# from the Roundball BC YouTube channel. Runs every Monday; when the JSON
# changes, the commit to main triggers the Pages deploy (jekyll.yml).
name: Update basketball highlight

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC (~7am Vancouver in summer)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Bagwork highlight
        run: python3 scripts/update-highlight.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/latest-highlight.json; then
            echo "Highlight already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/latest-highlight.json
          git commit -m "Auto-update: latest Bagwork highlight video"
          git push
