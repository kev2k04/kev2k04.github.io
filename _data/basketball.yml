blurb: >-
  Bagwork 2.0 is the second edition of our basketball team this year. The team
  originally started as a group of friends that I've met through different
  parts of my life, from high school, to university, to the gym, but since
  many of the original players are doing internships in different places
  around the world, we decided to create Bagwork 2.0 as a new version of the
  team.
