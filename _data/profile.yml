expertise:
  - name: Financial Modeling
    blurb: >-
      I rebuilt our weekly cash flow model in Power Query so 20+ source files
      consolidate on a refresh instead of by hand, and I run scenario and
      sensitivity analysis on a 14-year forecast to value contract
      opportunities.
  - name: FP&amp;A
    blurb: >-
      I own the weekly cash flow cycle and the monthly OH&amp;GA variance
      analysis across 30+ departments, digging into budget-to-actual and
      forecast variances that feed management and Board reporting.
  - name: Financial Analysis
    blurb: >-
      Pulling income statement numbers for Seaspan's 2027 Board deck and
      checking every figure in our presentations against the files behind it.
  - name: Statistical Data Analysis
    blurb: >-
      Cleaned and joined 600K+ call centre records at BC Hydro to find out why
