  - name: Business Analytics
    blurb: >-
      Found the IVR misrouting issue at BC Hydro that was sending half of our
      callers to the general queue.
  - name: Valuation
    blurb: >-
      Valued 15+ seed-stage healthcare startups at Joshua Tree Health using
      comparable companies and revenue multiples.
  - name: Forecasting
    blurb: >-
      Ran scenario and sensitivity analysis on a 14-year forecast, 2027 to 2040,
      and worked on the 5+7 forecast and the 2027 budget at Seaspan.
  - name: Variance Analysis
    blurb: >-
      Monthly OH&amp;GA variance analysis across 30+ departments, plus month-end
      program P&amp;L variance analysis for all 3 shipyards.
  - name: Power BI
    blurb: >-
      Visualized 600K+ call centre records at BC Hydro, with DAX, to show where
      handle time was going.
  - name: Excel
    blurb: >-
      My favourite tool. XLOOKUP, LET, Power Query and PivotTables are what
      took our weekly cash flow from 5 days down to 3.

