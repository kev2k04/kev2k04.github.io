  kind: panel
  title: Personal Fitness
  icon: dumbbell
  tagline: My ongoing journey in the gym, and out on the trails.
  accent: "34, 197, 94"       # green — health / fitness
  # Homepage photo tile (see basketball above).
  photo: /assets/images/passions/hiking/lake-crew.jpg
  photo_position: "center 68%"   # keep the three of us in frame when cropped
  # Panel copy — rewrite in your own words. `highlights:` (a list) is optional.
  blurb: >-
    Staying active is a big part of my routine. Most of it happens in the gym,
    but some of my favourite days are spent hiking up to alpine lakes with
    friends.
  # Photo grid in the panel. `wide: true` spans the full row.
  photos:
    - { image: /assets/images/passions/hiking/lake-crew.jpg, alt: "With friends at an alpine lake" }
    - { image: /assets/images/passions/hiking/trail.jpg, alt: "A trail through alpine meadow toward a campsite" }
    - { image: /assets/images/passions/hiking/lookout.jpg, alt: "Looking out over the clouds from a rocky ridge" }
    - { image: /assets/images/passions/hiking/alpine-lake.jpg, alt: "A misty alpine lake", wide: true }
