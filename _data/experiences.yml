# ---------------------------------------------------------------------------
# Experience panels — drives the /experience/ page.
# Each entry is fully independent: edit one without touching the others.
#
# PLACEHOLDERS to swap out later:
#   - logo: drop a real logo file in /assets/images/logos/ and set `logo:`
#     to its path. While empty, the monogram in `logo_text` is shown instead.
#   - blurb: replace the "Placeholder —" sentence with a real summary.
#   - skills: tweak the tag list to taste.
#   - image: each panel shows a sized photo placeholder; add a real photo via
#     the `image:` field (path under /assets/images/) when you have one.
# ---------------------------------------------------------------------------

- id: seaspan
  company: Seaspan
  logo_text: SE
  logo: "/assets/images/logos/seaspan.png"            # e.g. /assets/images/logos/seaspan.svg
  role: "FP&A Analyst"
  dates: "May 2026 – Present"
  location: "Vancouver, Canada"
  blurb: >-
    I'm currently working at Seaspan as a Financial Analyst Intern within the
    FP&amp;A department. Here, I support forecasting, budgeting, and executive
    reporting initiatives as a primary responsibility along with any Ad Hoc
    projects I can get my hands on!
  image: "/assets/images/seaspan.jpg"
  # Points can be a plain string OR an object. A `key: true` point becomes a
  # clickable, shining highlight; add `image:` to show a popup on hover.
  points:
    - key: true
      image: "/assets/images/CFO Townhall.jpg"
      text: >-
        During my first month at Seaspan, I had the opportunity to work on a
        long-term forecast model spanning 2027 to 2040. I ran scenario and
        sensitivity analyses that considered factors such as inflation,
        project-win assumptions, and best/worst-case outcomes. The work supported
        financial reporting for a CFO Town Hall, where the results were presented
        by Seaspan's CFO, James Clarke.
    - text: >-
        This project gave me early exposure to how long-range financial planning
        supports executive decision-making, and helped me better understand the
        role FP&amp;A plays in translating complex assumptions into clear business
        insights.
    - text: >-
        I currently own the monthly G&amp;A variance report, where I update data
        sources within the Excel master file, examine the variance, provide
        commentary, and then generate graphs to put in our financial reporting
        PowerPoint for executive reporting.
  skills:
    - Excel
    - SAP
    - Power BI
    - Variance Analysis
    - Forecasting
  # Photo gallery — the "Photo Gallery" button in the panel switches to these
  # square tiles. `contain: true` shows a wide photo whole (letterboxed) instead
  # of cropping it — used for the group photo so no one is cut off.
  gallery:
    - { image: "/assets/images/seaspan-gallery/1.jpg" }
    - { image: "/assets/images/seaspan-gallery/2.jpg" }
    - { image: "/assets/images/seaspan-gallery/3.jpg" }
    - { image: "/assets/images/seaspan-gallery/4.jpg", contain: true }
    - { image: "/assets/images/seaspan-gallery/5.jpg" }
    - { image: "/assets/images/seaspan-gallery/6.jpg" }
    - { image: "/assets/images/seaspan-gallery/7.jpg" }

- id: bchydro
  company: BC Hydro
  logo_text: BC
  logo: "/assets/images/logos/bchydro.png"
  role: "Business Analyst Intern"
  dates: "May 2025 – Dec 2025"
  location: "Vancouver, Canada"
  # The phrase wrapped in <button class="exp-inline-key"> shines and opens the
  # desk photo on click (see highlight-photo.js / hl-lightbox).
  blurb: >-
    Last year, <button type="button" class="exp-inline-key"
    data-hl-image="/assets/images/bc-hydro-desk.jpg" data-hl-alt="My BC Hydro desk"
    aria-haspopup="dialog">I worked at BC Hydro as a business analyst intern</button>,
    where I worked along side the Customer Operations and Analytics team (now known
    as the Innovation and Sustainability team) to solve operational inefficiencies
    within our workflows, softwares, and departments.
  image: "/assets/images/bc-hydro-wallpaper.jpg"
  points:
    - "My largest project at BC Hydro focused on reducing the average handle time within the call centre, where costs were exceeding +$1M annually. I utilized software such as Excel, Power BI, Power Query, and DAX Studio to pull and consolidate datasets of over 600,000 rows, then delivered a proposal outlining initiatives around agent training, performance tracking, and system gap identification. This proposal looked to ultimately help reduce average handle time by 6 seconds per agent (or over $50,000 per year) at zero additional cost when fully integrated."
    - "My second project focused on fixing the Interactive Voice Response (IVR) system, where inaccurate call tagging left over 50% of call drivers unidentifiable in our database. By improving utterance recognition through Google Dialogflow, I reduced the misclassification rate from 30% to 25%. This 5-percentage-point improvement, when scaled across 600,000 annual calls, had the potential to save over 150,000 minutes in misdirected handle time annually."
    - "Nearing the end of my time at BC Hydro, I helped build a financial forecasting model that incorporated various growth assumptions, cost drivers, and scenarios to project changes in Canada Post expenses under different rate and fee structures. With annual Canada Post expenses exceeding $10 million, the model supported financial planning, reporting, and executive level decision making."
    - "One of the most impactful experiences for developing my software and analytical skills was supporting BC Hydro's Call for Power Energy Management Portfolio initiative, which enabled owners of multiple properties to consolidate their accounts and access preferred energy rates. To improve application quality and reporting accuracy, I reconciled data for 1,500+ external companies across two unstructured Excel trackers and submission databases, creating a reliable dataset for categorization, trend analysis, forecasting, and management reporting."
    - 'The most enjoyable experience I had at BC Hydro was organizing a team building event as an intern. At the time, three separate teams had recently been merged into one, creating some ambiguity around roles and responsibilities. I led team exercises to identify which responsibilities belonged to each department, encouraged open communication among team members, and helped coordinate a team outing afterward. As part of the event, we participated in a guided <a class="exp-link" href="https://chinatowngirl.ca" target="_blank" rel="noopener noreferrer">history tour of Vancouver''s Chinatown led by Judy Maxwell</a>, where we learned about the history and cultural significance of the neighborhood.'
  skills:
    - Excel
    - Power BI
    - Power Query
    - DAX Studio
    - Google Dialogflow
    - Forecasting

- id: joshuatree
  company: Joshua Tree Health
  logo_text: JT
  logo: "/assets/images/logos/joshuatree.png"
  logo_full: true     # logo fills the chip edge-to-edge (no white padding)
  role: "Analyst, Private Equity"
  dates: "Oct 2024 – May 2025"
  location: "Vancouver, Canada"
  blurb: >-
    My first professional experience was with Joshua Tree Health, a private
    equity and venture capital firm dedicated to improving the healthcare
    industry through innovative solutions that increase accessibility and
    availability.
  image: "/assets/images/joshua-tree.jpg"
  points:
    - >-
      I learned a great deal about the U.S. healthcare industry, which was
      significantly different from Canada's healthcare system due to its
      combination of private healthcare providers and private insurance, compared
      to Canada's predominantly publicly funded model. This gave me a much better
      understanding of how different healthcare systems create unique investment
      opportunities, business models, and competitive dynamics within the
      healthcare sector.
    - >-
      I conducted niche market research and screened U.S. healthcare startups with
      under $1 million in EBITDA. As part of this process, I analyzed financial
      statements, earnings performance, working capital trends, and balance sheet
      risk to better understand the financial characteristics of companies
      operating within the niche markets I was researching. This research helped
      identify long term market trends and evaluate whether companies aligned with
      our firm's investment strategy.
    - >-
      I evaluated the financial health of more than 15 seed-stage healthcare
      startups using a variety of valuation methodologies, including comparable
      company analysis, precedent transactions, and both EV/Revenue and EV/EBITDA
      multiples where appropriate, depending on each company's stage of maturity
      and financial profile. I assessed each company's scalability, revenue
      sustainability, competitive positioning, and overall investment
      attractiveness before presenting my findings to the investment team. These
      analyses were then used as benchmarks to compare against companies sourced
      by our deal sourcing team that were being considered for potential investment
      or acquisition opportunities alongside other venture capital firms.
  skills:
    - Excel
    - Capital IQ
    - PitchBook
    - Valuation
    - Market Research

- id: robotics
  company: UBC Open Robotics
  logo_text: OR
  logo: "/assets/images/logos/robotics.png"
  role: "Finance Executive"
  dates: "Mar 2024 – May 2025"
  location: "Vancouver, Canada"
  blurb: >-
    My first involvement at UBC was with an engineering club called UBC Open
    Robotics, which is focused on fostering an environment for the next
    generation of innovative engineers.
  image: "/assets/images/open-robotics-arm.jpg"
  points:
    - >-
      In this role, I served as a financial executive, helping manage a team of
      over 60 active participants within the executive structure. This involved
      attending weekly leadership meetings and coordinating monthly in-person
      events to support team engagement and club operations. During this time, I
      also led the team through a period of significant transition, as we
      underwent management changes and a full organizational restructuring, which
      required revamping workflows, redefining roles, and maintaining stability
      across the club during a confusing and uncertain phase.
    - >-
      I created the 2024 Sponsorship Package, outlining the values, mission, and
      objectives of UBC Open Robotics to attract external sponsors and secure
      funding opportunities. This initiative ultimately contributed to the club
      securing sponsorship from Saber.
    - >-
      I led a cross-functional team of administrators, executives, social media
      managers, and graphic designers in developing the sponsorship package,
      coordinating efforts across more than 7 departments and 10 faculties, which
      strengthened my project management and cross-team communication skills.
    - >-
      I also oversaw and managed a $10,000 per semester operational budget,
      ensuring efficient allocation of resources across technical projects and
      administrative needs. This included approving equipment purchases,
      allocating funds for project development, and budgeting for team-building
      and club events.
  skills:
    - Excel
    - Budgeting
    - Sponsorship
    - Stakeholder Management
