# ---------------------------------------------------------------------------
# Experience panels — drives the /experience/ page.
# Each entry is fully independent: edit one without touching the others.
#
# PLACEHOLDERS to swap out later:
#   - logo: drop a real logo file in /assets/images/logos/ and set `logo:`
#     to its path. While empty, the monogram in `logo_text` is shown instead.
#   - blurb: replace the "Placeholder —" sentence with a real summary.
#   - skills: tweak the tag list to taste (shown in the details panel).
#   - key_skills: optional short list for the timeline card; without it the
#     card shows the first 4 skills.
#   - image: each panel shows a sized photo placeholder; add a real photo via
#     the `image:` field (path under /assets/images/) when you have one.
# ---------------------------------------------------------------------------

- id: seaspan
  company: Seaspan
  logo_text: SE
  logo: "/assets/images/logos/seaspan.png"            # e.g. /assets/images/logos/seaspan.svg
  role: "FP&A Analyst Intern"
  dates: "May 2026 – Present"
  location: "Vancouver, Canada"
  blurb: >-
    I'm currently an FP&amp;A Analyst Intern at Seaspan. I own the weekly cash
    flow cycle, helped build the 2027 budget, and support the forecasting and
    reporting that goes up to the CFO and the Board, all while Seaspan moves
    onto Oracle, one of the largest ERP transitions in Canada.
  image: "/assets/images/seaspan.jpg"
  # Points can be a plain string OR an object. A `key: true` point becomes a
  # clickable, shining highlight; add `image:` to show a popup on hover.
  # Every number here matches the resume (assets/Kevin-Liu-FPA-Resume.pdf).
  points:
    - text: >-
        Cash flow is my baby at Seaspan. When the FA2 who owned it left the
        company, I took over the 13-week rolling forecast of AP and AR, and
        quickly learned what a poorly maintained legacy file looks like. Every
        week I consolidate 6,000+ invoices from billing and SAP BI into AP and
        AR totals across our 3 shipyards and 5+ programs, working with the AP,
        AR, treasury, billing, and program finance teams, then take the AP
        release through approval with the Controller, VP Finance, and CFO.
    - text: >-
        The process started out almost entirely manual: hardcoded pastes, a long
        weekly email of invoices to the billing team, and a Monday spent
        checking their replies one by one. I replaced the email with a shared
        file on Teams that feeds our AP file through XLOOKUP and LET formulas,
        then tied the consolidated file to the AP, AR, treasury, and prior-week
        numbers with lookups. Using Power Query, PivotTables, formulas, and
        slicers, 20+ files across billing, treasury, and program finance now
        update on a refresh, which cut the cycle from 5 days to 3.
    - text: >-
        I also contributed to Seaspan's Oracle ERP transformation, one of the
        largest ERP transitions in Canada. When our invoice list changed format,
        I learned the new mapping, automated a weekly Oracle download into the
        AP file, and matched each invoice to its project and the chart of
        accounts so unbillable costs are flagged automatically (IF and IFNA).
        Before go-live came a blackout period where invoices had to be paid 4
        weeks ahead, so we worked with the billing team against a forecasted AP
        limit to decide what could be released before taking it to the VP
        Finance.
    - text: >-
        For the 2027 budget, I worked across the three big pieces: headcount,
        labour hours, and department costs. For the Board deck, I pulled income
        statement numbers for the profitability graphs, built headcount
        waterfall charts, calculated FTEs from labour and production hours,
        consolidated slides from program finance and capex, and wrote the
        commentary on OH&amp;GA variances between the 2027 budget and the 2026
        forecast.
    - text: >-
        Alongside the budget, I helped track cost-saving opportunities across
        20+ departments, including an intern headcount initiative. Each
        department received an allocated number of interns, and I worked with
        the department owners to confirm their counts, tracked which roles would
        continue into 2027, followed up with the CFO on requests for more, and
        delivered the final intern list for the budget. I also calculated the
        roll-offs from Project Horizon, the team behind the Oracle move, as
        people returned to their previous roles.
    - key: true
      image: "/assets/images/CFO Townhall.jpg"
      text: >-
        One of my most memorable moments was the CFO Town Hall in North
        Vancouver. I worked on a 14-year income statement forecast spanning
        2027 to 2040, running scenario and sensitivity analysis on inflation,
        project-win probability, and best and worst cases to support the CFO's
        capital investment initiatives across 10+ contract opportunities. Seeing
        my slide presented by Seaspan's CFO, James Clarke, was a highlight, even
        if most of this work is appreciated in silence.
    - text: >-
        One of my first projects was the 5+7 forecast: five months of actuals
        and seven months forecast. I compared January to May actuals against
        budget, number-checked presentation material against our files, sat in
        on meetings with budget owners, and uploaded the forecast to E1. When
        the work picked up in June and the asks started stacking, I started
        taking notes, recording our team meetings, and confirming asks in
        1-on-1s. It taught me how much organization and accountability matter.
    - text: >-
        Every month I run the OH&amp;GA variance analysis across 30+ departments
        and the month-end variance analysis on the program-level P&amp;Ls for all
        3 shipyards, identifying the drivers behind budget-to-actual differences
        and validating balance sheet figures, ROIC, and other key performance
        metrics before they reach CFO and Board reporting.
  # Feature story — renders as a clickable card in the panel's detail view that
  # opens a third view (alongside details / gallery). Add `feature:` to any
  # experience to give it one.
  feature:
    id: open-house
    kicker: Event
    date: "25 July 2026"
    place: Vancouver Shipyards
    title: Seaspan Open House
    teaser: >-
      I attended the Seaspan Open House where I was able to tour the yard and
      see the vessels being built in progress, along with the different stages
      of construction!
    hero: "/assets/images/seaspan-open-house/6.jpg"
    hero_alt: "JSS1 under construction in the Seaspan Vancouver Shipyards dry dock"
    body:
      - >-
        I attended the Seaspan Open House where I was able to tour the yard and
        see the vessels being built in progress, along with the different stages
        of construction!
      - >-
        The highlight for me was getting to see JSS1 up close. It's the first
        Joint Support Ship we're delivering to the Royal Canadian Navy, and it's
        set to launch in December 2026. Standing next to it, you get a sense of
        scale that never really comes across in a spreadsheet.
      - >-
        Honestly, seeing the ship and all the different stages of construction
        changed how I read the numbers I work with. Before this, the program was
        mostly a set of balance sheet and income statement line items to me. Now
        I picture the actual ship behind them, and the people building it.
    photos:
      - { image: "/assets/images/seaspan-open-house/1.jpg", caption: "The Block Assembly Shop, where hull sections begin as flat steel." }
      - { image: "/assets/images/seaspan-open-house/4.jpg", caption: "Superstructure going up under crane." }
      - { image: "/assets/images/seaspan-open-house/3.jpg", caption: "Walking the yard toward the berth." }
      - { image: "/assets/images/seaspan-open-house/2.jpg", caption: "The yard's bays opened up for the day." }
      - { image: "/assets/images/seaspan-open-house/5.jpg", caption: "Looking back across Burrard Inlet to downtown Vancouver." }
  # Shown on the Experience timeline card.
  key_skills: [Excel, Forecasting, Budgeting, Financial Modelling, Automation, SAP BI]
  # Full list in the details panel.
  skills:
    - Excel
    - Power Query
    - Power BI
    - DAX
    - Tableau
    - SAP BI
    - Oracle ERP
    - FP&A
    - Financial Modeling
    - Scenario & Sensitivity Analysis
    - Variance Analysis
    - Cash Flow Forecasting
    - Cost Allocation (OH&GA)
    - Process Automation
    - Data Modelling
  # Photo gallery — the "Photo Gallery" button in the panel switches to these
  # tiles: a 3×2 grid of square shots, then the group photo (`wide: true`)
  # spanning the full row on its own so no one is cropped out.
  gallery:
    - { image: "/assets/images/seaspan-gallery/team-dinner.jpg", wide: true }
    - { image: "/assets/images/seaspan-gallery/1.jpg" }
    - { image: "/assets/images/seaspan-gallery/2.jpg" }
    - { image: "/assets/images/seaspan-gallery/3.jpg" }
    - { image: "/assets/images/seaspan-gallery/5.jpg" }
    - { image: "/assets/images/seaspan-gallery/6.jpg" }
    - { image: "/assets/images/seaspan-gallery/7.jpg" }
    - { image: "/assets/images/seaspan-gallery/pier.jpg" }
    - { image: "/assets/images/seaspan-gallery/office-move.jpg", span2: true }
    - { image: "/assets/images/seaspan-gallery/4.jpg", wide: true }

- id: bchydro
  company: BC Hydro
  logo_text: BC
  logo: "/assets/images/logos/bchydro.png"
  role: "Business Analyst Intern"
  dates: "May 2025 – Dec 2025"
  location: "Vancouver, Canada"
  # The phrase wrapped in <button class="exp-inline-key"> shines and opens the
  # desk photo on click (see highlight-photo.js / hl-lightbox).
  blurb: >-
    Last year, <button type="button" class="exp-inline-key"
    data-hl-image="/assets/images/bc-hydro-desk.jpg" data-hl-alt="My BC Hydro desk"
    aria-haspopup="dialog">I worked at BC Hydro as a business analyst intern</button>,
    where I worked along side the Customer Operations and Analytics team (now known
    as the Innovation and Sustainability team) to solve operational inefficiencies
    within our workflows, softwares, and departments.
  image: "/assets/images/bc-hydro-wallpaper.jpg"
  points:
    - "My largest project at BC Hydro focused on reducing the average handle time within the call centre. Using Excel, Power BI, Power Query, and DAX Studio, I recovered and processed 50% more of our lost call centre data by joining and cleaning 600K+ records, then delivered a proposal around agent training, performance tracking, and system gap identification. Visualizing the results showed a path to lift agent efficiency by 5% and save $50,000+ a year through reduced customer handling time, at zero additional cost once fully integrated."
    - "My second project focused on the Interactive Voice Response (IVR) system. Analyzing the same dataset, I found a misrouting issue that sent 50% of callers to the general queue after failed verification, where repeated transfers and re-verification by multiple agents added 5 minutes to each interaction. By analyzing Google Dialogflow call data for high-frequency intent phrases, I improved utterance recognition and reduced the error rate from 30% to 25% across 4,000 calls, projected to save 150,000+ minutes a year at scale."
    - "Nearing the end of my time at BC Hydro, I helped build a financial forecasting model that incorporated various growth assumptions, cost drivers, and scenarios to project changes in Canada Post expenses under different rate and fee structures. With Canada Post expenses exceeding $10 million YTD, the model supported financial planning, reporting, and executive level decision making."
    - "One of the most impactful experiences for developing my software and analytical skills was supporting BC Hydro's Call for Power Energy Management Portfolio initiative, which enabled owners of multiple properties to consolidate their accounts and access preferred energy rates. To improve application quality and reporting accuracy, I reconciled data for 1,500+ external companies across two unstructured Excel trackers and submission databases, creating a reliable dataset for categorization, trend analysis, forecasting, and management reporting."
    - 'The most enjoyable experience I had at BC Hydro was organizing a team building event as an intern. At the time, three separate teams had recently been merged into one, creating some ambiguity around roles and responsibilities. I led team exercises to identify which responsibilities belonged to each department, encouraged open communication among team members, and helped coordinate a team outing afterward. As part of the event, we participated in a guided <a class="exp-link" href="https://chinatowngirl.ca" target="_blank" rel="noopener noreferrer">history tour of Vancouver''s Chinatown led by Judy Maxwell</a>, where we learned about the history and cultural significance of the neighborhood.'
  # Feature story — same role-agnostic block the Seaspan Open House uses.
  #
  # TO FILL IN (all of these are optional in the template — anything left blank
  # or commented out simply doesn't render, so nothing placeholder-looking ever
  # reaches the live site):
  #   date:      the Chinatown outing date. Blank hides the date AND place line.
  #   hero:      a photo from the Chinatown tour, e.g.
  #              /assets/images/bc-hydro-chinatown/hero.jpg (+ hero_alt).
  #   photos:    uncomment the block at the bottom and point each `image:` at a
  #              real file; each takes an optional `caption:`.
  # The body copy below is drawn from the two stories already told in `points:`
  # above — rewrite freely, it's yours.
  feature:
    id: chinatown-ivr
    kicker: Deep dive
    date: ""                     # e.g. "12 September 2025"
    place: "Vancouver Chinatown"
    title: Chinatown, and the calls that went nowhere
    teaser: >-
      The two things I remember most from BC Hydro: organizing a team-building
      day for three teams that had just been merged into one, and untangling an
      IVR system that couldn't tell what half our callers wanted.
    hero: ""                     # e.g. "/assets/images/bc-hydro-chinatown/hero.jpg"
    hero_alt: ""
    body:
      - >-
        My time at BC Hydro really came down to two things I keep coming back
        to. One was about people, and the other was about a system that quietly
        wasn't working. They happened months apart, but I think about them
        together, because both were really the same problem: something was
        getting lost between the people involved.
      - >-
        The people one first. Three separate teams had recently been merged into
        a single group, and nobody was quite sure where one team's
        responsibilities ended and the next began. As the intern, I organized a
        team-building day to work through it. I ran exercises to map which
        responsibilities actually belonged to which department, pushed for open
        conversation about the overlaps people had been quietly working around,
        and then coordinated an outing afterwards so the day didn't end on a
        whiteboard.
      - >-
        We spent that afternoon on a guided history tour of Vancouver's
        Chinatown led by Judy Maxwell, learning about the history and cultural
        significance of the neighbourhood. It was easily the most enjoyable
        thing I did there, and it did more for how the team worked together than
        any of the exercises I'd planned.
      - >-
        The system one was the Interactive Voice Response line. Half of our
        callers were failing verification and landing in the general queue,
        where repeated transfers and re-verification by multiple agents added
        5 minutes to each interaction. I worked on utterance recognition in
        Google Dialogflow and brought the error rate down from 30% to 25%
        across 4,000 calls, which projected to save 150,000+ minutes a year at
        scale that were being spent sending people to the wrong place.
      - >-
        What stuck with me is that the second problem was invisible until
        someone went looking for it. Nothing was on fire. The line worked, calls
        got answered, and a quarter of the people on them were still being
        misrouted.
    # photos:
    #   - { image: "/assets/images/bc-hydro-chinatown/1.jpg", caption: "" }
    #   - { image: "/assets/images/bc-hydro-chinatown/2.jpg", caption: "" }
  key_skills: [Excel, Power BI, Power Query, SAP BI, DAX Studio]
  skills:
    - Excel
    - Power BI
    - Power Query
    - DAX Studio
    - SAP BI
    - Google Dialogflow
    - Forecasting

- id: joshuatree
  company: Joshua Tree Health
  logo_text: JT
  logo: "/assets/images/logos/joshuatree.png"
  logo_full: true     # logo fills the chip edge-to-edge (no white padding)
  role: "Analyst, Private Equity Intern"
  dates: "Oct 2024 – May 2025"
  location: "Vancouver, Canada"
  blurb: >-
    My first professional experience was with Joshua Tree Health, a private
    equity and venture capital firm focused on making healthcare more
    accessible and available.
  image: "/assets/images/joshua-tree.jpg"
  points:
    - >-
      I learned a great deal about the U.S. healthcare industry, which was
      significantly different from Canada's healthcare system due to its
      combination of private healthcare providers and private insurance, compared
      to Canada's predominantly publicly funded model. This gave me a much better
      understanding of how different healthcare systems create unique investment
      opportunities, business models, and competitive dynamics within the
      healthcare sector.
    - >-
      I conducted niche market research and screened U.S. healthcare firms with
      under $1 million USD in EBITDA. As part of this process, I analyzed financial
      statements, earnings performance, working capital trends, and balance sheet
      risk to better understand the financial characteristics of companies
      operating within the niche markets I was researching. This research helped
      identify long term market trends and evaluate whether companies aligned with
      our firm's investment strategy.
    - >-
      I evaluated the financial health of more than 15 seed-stage healthcare
      startups with limited or early revenue (under $500,000 ARR) using a variety of valuation methodologies, including comparable
      company analysis, precedent transactions, and both EV/Revenue and EV/EBITDA
      multiples where appropriate, depending on each company's stage of maturity
      and financial profile. I assessed each company's scalability, revenue
      sustainability, competitive positioning, and overall investment
      attractiveness before presenting my findings to the investment team. These
      analyses were then used as benchmarks to compare against companies sourced
      by our deal sourcing team that were being considered for potential investment
      or acquisition opportunities alongside other venture capital firms.
  skills:
    - Excel
    - Capital IQ
    - PitchBook
    - Valuation
    - Market Research

- id: robotics
  company: UBC Open Robotics
  logo_text: OR
  logo: "/assets/images/logos/robotics.png"
  role: "Finance Executive"
  dates: "Mar 2024 – May 2025"
  location: "Vancouver, Canada"
  blurb: >-
    My first involvement at UBC was with an engineering club called UBC Open
    Robotics, an engineering club focused on helping the next generation of
    engineers grow.
  image: "/assets/images/open-robotics-arm.jpg"
  image_contain: true          # show the whole frame (no cover-crop) so it reads at full width
  points:
    - >-
      In this role, I served as a financial executive, helping manage a team of
      over 60 active participants within the executive structure. This involved
      attending weekly leadership meetings and coordinating monthly in-person
      events to support team engagement and club operations. During this time, I
      also led the team through a period of significant transition, as we
      underwent management changes and a full organizational restructuring, which
      required revamping workflows, redefining roles, and maintaining stability
      across the club during a confusing and uncertain phase.
    - >-
      I created the 2024 Sponsorship Package, outlining the values, mission, and
      objectives of UBC Open Robotics to attract external sponsors and secure
      funding opportunities. This initiative ultimately contributed to the club
      securing sponsorship from Saber.
    - >-
      I led a cross-functional team of administrators, executives, social media
      managers, and graphic designers in developing the sponsorship package,
      coordinating efforts across more than 7 departments and 10 faculties, which
      strengthened my project management and cross-team communication skills.
    - >-
      I also oversaw and managed a $10,000 per semester operational budget,
      ensuring efficient allocation of resources across technical projects and
      administrative needs. This included approving equipment purchases,
      allocating funds for project development, and budgeting for team-building
      and club events.
  skills:
    - Excel
    - Budgeting
    - Sponsorship
    - Stakeholder Management
