# --- Site settings ---------------------------------------------------------
# Edit these values to personalize your portfolio.

title: Kevin Liu
tagline: Student at the University of British Columbia
description: >-
  Personal portfolio of Kevin Liu, a UBC Sauder commerce student and financial
  analyst specializing in FP&amp;A, financial modeling, and data-driven analytics.

# Your contact email (used in the footer and contact section)
email: Kev2k04@gmail.com

# The URL where the site will live.
# For a user/organization page (username.github.io) leave baseurl as "".
# For a project page (username.github.io/repo-name) set:
#   baseurl: "/repo-name"
# The live custom domain. GitHub Pages serves the repo, but kev2k04.github.io
# 301s here — so this, not the github.io address, is the canonical URL that
# jekyll-seo-tag builds absolute og:/canonical links from. The CNAME file at
# the repo root is what keeps the domain attached to the build (and is what
# lets GitHub issue the TLS certificate); don't delete it.
url: "https://www.kevliu.ca"
baseurl: ""

# Default share image for link previews (Open Graph / Twitter cards).
# Expects a 1200x630 JPEG at the path below.
#
# jekyll-seo-tag reads `image` from a page's front matter, NOT from a top-level
# site key — so the `defaults` block further down is what actually wires it in.
# This key is the declared source of truth; keep the two paths identical.
image: /assets/images/share-card.jpg

# Render the share image as a full-bleed card rather than a small thumbnail.
twitter:
  card: summary_large_image

# --- Build settings --------------------------------------------------------
markdown: kramdown
permalink: pretty

# Give every page the default share image (see `image:` above). Any page can
# override it by setting its own `image:` in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/share-card.jpg

# Sass / CSS pipeline
sass:
  style: compressed

# Exclude these from the build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache
  # Node / serverless API (run by Vercel/Netlify, not part of the static site)
  - api
  - node_modules
  - package.json
  - package-lock.json
  - .env
  - .env.example
  - OVERNIGHT_LOG.md

# Jekyll plugins (all whitelisted by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
